<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Real-Time Two-Person Chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <!-- User Selection -->
        <div id="user-selection" class="user-selection">
            <h1>🔥 Real-Time Chat</h1>
            <p>Enter your name and choose:</p>
            <input type="text" id="username-input" placeholder="Your name" maxlength="20" autocomplete="off">
            <div class="user-buttons">
                <button id="user1-btn" class="user-btn user1">🟦 Person 1</button>
                <button id="user2-btn" class="user-btn user2">🟩 Person 2</button>
            </div>
            <div class="status-note">Status: <span id="firebase-status">Not connected</span></div>
            <p class="instruction">Share this exact link with your friend!</p>
        </div>

        <!-- Chat Interface -->
        <div id="chat-container" class="chat-container" style="display: none;">
            <div class="chat-header">
                <span id="current-user"></span>
                <span class="status" id="connection-status">🔄 Connecting...</span>
            </div>
            <div id="messages" class="messages"></div>
            <div class="message-input">
                <input type="text" id="message-input" placeholder="Type message (Enter to send)" maxlength="500">
                <button id="send-btn">Send</button>
                <button id="clear-btn">Clear</button>
            </div>
            <div id="typing-indicator" class="typing-indicator"></div>
        </div>
    </div>

        };
    </script>
    <script src="script.js"></script>
</body>
</html>
